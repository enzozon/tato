name: tato

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: tato
      POSTGRES_DB: tato
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copie .env.example para .env e defina a senha local}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tato -d tato"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8.0-alpine
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
