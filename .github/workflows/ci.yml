name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Interface e PWA
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # versão 6
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run build
      - run: npm run check:web
      - run: npm exec --workspace=tato-web -- playwright install --with-deps chromium
      - run: npm exec --workspace=tato-web -- playwright test --config=playwright.pwa.config.ts
      - run: npm test --workspace=tato-web

  quality:
    name: Qualidade Python
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # versão 7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # versão 10.2.0
        with:
          version: "0.12.17"
          enable-cache: true
      - run: make sync
      - run: uv run --locked pre-commit run --all-files

  infrastructure:
    name: Infraestrutura local
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      POSTGRES_PASSWORD: tato_ci_sintetico
      DATABASE_MIGRATION_URL: postgresql+psycopg://tato:tato_ci_sintetico@127.0.0.1:5432/tato_test
      DATABASE_URL: postgresql+psycopg://tato_app:tato_ci_app@127.0.0.1:5432/tato_test
      TEST_DATABASE_ADMIN_URL: postgresql+psycopg://tato:tato_ci_sintetico@127.0.0.1:5432/tato_test
      TEST_DATABASE_URL: postgresql+psycopg://tato_app:tato_ci_app@127.0.0.1:5432/tato_test
      # Chaves sintéticas exclusivamente para o banco descartável do CI.
      DATA_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      DEDUP_HMAC_KEY: AQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQE=
      PYTHONPATH: apps/api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # versão 7.0.1
      - name: Validar configuração do Compose
        run: docker compose config --quiet
      - name: Iniciar serviços com healthchecks
        run: make infra-up
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # versão 6
        with:
          version: "0.12.17"
          enable-cache: true
      - run: make sync
      - name: Criar banco descartável de integração
        run: >-
          docker compose exec -T postgres psql -U tato -d tato
          -v ON_ERROR_STOP=1 -c "CREATE DATABASE tato_test;"
      - run: uv run --locked python scripts/bootstrap_db.py
      - run: uv run --locked alembic upgrade head
      - run: uv run --locked alembic check
      - name: Executar seed duas vezes sem duplicar dados
        run: |
          uv run --locked python scripts/seed_demo.py
          uv run --locked python scripts/seed_demo.py
      - run: make integration
      - name: Avaliar RAG com modelos reais
        run: make rag-eval
      - name: Validar reversão em banco descartável
        run: |
          uv run --locked alembic downgrade base
          uv run --locked alembic upgrade head
          uv run --locked alembic check
      - name: Verificar resposta do Redis
        run: test "$(docker compose exec -T redis redis-cli ping)" = "PONG"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm exec --workspace=tato-web -- playwright install --with-deps chromium
      - name: Validar interface com Postgres real
        run: npm exec --workspace=tato-web -- playwright test --config=playwright.integration.config.ts
      - name: Encerrar ambiente descartável do CI
        if: always()
        run: docker compose down -v
